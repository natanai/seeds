<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Encode and decode game seeds.">
  <title>Meaningful Seeds</title>
  <link rel="stylesheet" href="style.css?v=7">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script defer src="seed-core.js?v=7"></script>
  <script defer src="force-fit.js?v=7"></script>
  <script defer src="seed-trace.js?v=7"></script>
  <script defer src="app.js?v=7"></script>
</head>
<body>
  <div id="app">
    <header class="masthead">
      <h1>Meaningful Seeds</h1>
      <div class="select">
        <label class="sr-only" for="game">Seed format</label>
        <select id="game"></select>
      </div>
    </header>

    <main id="workspace" data-view="encode">
      <div class="editor">
        <section id="encode-panel" aria-label="Encode">
          <label for="keyword">Keyword</label>
          <div class="input-row">
            <textarea id="keyword" class="entry" rows="1"
              autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"></textarea>
            <button id="encode-key" class="key-menu" type="button" aria-label="Secret key" aria-haspopup="dialog">…</button>
            <button class="done" type="button" data-done="keyword">Done</button>
          </div>
        </section>

        <section id="decode-panel" aria-label="Decode" hidden>
          <div class="field-label" id="decode-heading">
            <div class="field-caption">
              <label for="seed-input">Seed</label>
              <button id="explain-decoding" class="seed-info" type="button"
                aria-label="Explain seed decoding" aria-haspopup="dialog" disabled><span aria-hidden="true">i</span></button>
            </div>
          </div>
          <div class="input-row">
            <div class="copy-field">
              <textarea id="seed-input" class="entry" rows="1"
                autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"></textarea>
              <button class="copy-button" type="button" data-copy="seed-input" aria-label="Copy seed" disabled></button>
            </div>
            <button id="decode-key" class="key-menu" type="button" aria-label="Secret key" aria-haspopup="dialog">…</button>
            <button id="roll" type="button" hidden>Roll</button>
            <button class="done" type="button" data-done="seed-input">Done</button>
          </div>
        </section>

        <section id="keypad-panel" aria-label="Phone keypad" hidden>
          <div class="keypad-entry">
            <label for="phone-text">Keyword</label>
            <input id="phone-text" class="entry" type="text" readonly>
            <button id="use-keyword" type="button">Use keyword</button>
          </div>
          <div id="phone-keys" class="phone-keys" aria-label="Keypad"></div>
        </section>

      </div>

      <section id="result" class="result" aria-label="Result">
        <div id="method-row">
          <label class="sr-only" for="method">Method</label>
          <div class="select">
            <select id="method"></select>
          </div>
          <button id="choose-seed" type="button" aria-label="Choose a seed for me"
            title="Choose a seed for me"><span aria-hidden="true">⚄</span></button>
        </div>
        <button id="all-readings" type="button" hidden>All readings</button>

        <div id="value-row">
          <div class="field-label" id="result-heading">
            <div class="field-caption">
              <label id="result-label" for="result-value">Seed</label>
              <button id="explain-method" class="seed-info" type="button"
                aria-label="Explain seed encoding" aria-haspopup="dialog"><span aria-hidden="true">i</span></button>
            </div>
            <a id="map" target="_blank" rel="noopener" hidden>Map</a>
          </div>
          <div class="copy-field">
            <textarea id="result-value" class="entry output-value" rows="1" readonly></textarea>
            <button class="copy-button" type="button" data-copy="result-value" aria-label="Copy seed" disabled></button>
          </div>
        </div>
        <div id="recovery-row" hidden>
          <label for="recovery-key">Secret key</label>
          <div class="copy-field">
            <input id="recovery-key" class="entry output-value" type="text" readonly>
            <button class="copy-button" type="button" data-copy="recovery-key" aria-label="Copy key" disabled></button>
          </div>
        </div>

        <p id="result-status" role="status" hidden></p>
        <section id="readings" aria-label="Seed readings" hidden>
          <div class="pager" id="reading-pager">
            <button id="reading-previous" type="button" aria-label="Previous readings">&larr;</button>
            <output id="reading-page" aria-label="Readings page"></output>
            <button id="reading-next" type="button" aria-label="Next readings">&rarr;</button>
          </div>
          <div id="reading-list"></div>
        </section>
      </section>
    </main>

    <nav class="tabs" aria-label="Tools">
      <button type="button" data-tab="encode" aria-current="page">Encode</button>
      <button type="button" data-tab="decode">Decode</button>
      <button type="button" data-tab="keypad">Keypad</button>
    </nav>

    <dialog id="method-dialog" aria-labelledby="method-title">
      <header class="dialog-heading">
        <h2 id="method-title"></h2>
        <form method="dialog"><button>Close</button></form>
      </header>
      <section id="trace-body" aria-labelledby="trace-title">
        <h3 id="trace-title"></h3>
        <p id="trace-note"></p>
        <dl id="trace-rows"></dl>
      </section>
      <footer class="trace-footer">
        <a id="trace-source" target="_blank" rel="noopener">Source</a>
        <div class="pager" id="trace-pager">
          <button id="trace-prev" type="button" aria-label="Previous calculation">&larr;</button>
          <output id="trace-page" aria-label="Calculation page" aria-live="polite"></output>
          <button id="trace-next" type="button" aria-label="Next calculation">&rarr;</button>
        </div>
      </footer>
    </dialog>
    <dialog id="key-dialog" aria-labelledby="key-title">
      <h2 id="key-title">Secret key</h2>
      <form id="key-form" method="dialog">
        <label class="sr-only" for="key-input">Secret key</label>
        <div class="copy-field">
          <input id="key-input" class="entry" type="text"
            autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
          <button class="copy-button" type="button" data-copy="key-input" aria-label="Copy key" disabled></button>
        </div>
        <div class="key-actions">
          <button id="generate-key" type="button" aria-label="Generate key">Generate</button>
          <button type="submit">Done</button>
        </div>
      </form>
      <p id="key-copy-status" class="sr-only" role="status"></p>
    </dialog>
    <p id="copy-status" class="sr-only" role="status"></p>
    <noscript>Enable JavaScript to use the seed tools.</noscript>
  </div>
</body>
</html>
