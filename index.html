<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Encode phrases into game seeds, decode seed codes and keep a list of worlds to try.">
  <title>Meaningful Seeds</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script defer src="seed-core.js"></script>
  <script defer src="examples.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div id="app">
    <header class="masthead">
      <h1>Meaningful Seeds</h1>
      <div class="select">
        <label class="sr-only" for="game">Seed format</label>
        <select id="game"></select>
      </div>
    </header>

    <main id="workspace" data-view="encode">
      <div class="editor">
        <section id="encode-panel" aria-label="Encode">
          <label for="phrase">Phrase</label>
          <div class="input-row">
            <input id="phrase" class="entry" type="text" placeholder="e.g. MOSS HOME"
              autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
            <button class="done" type="button" data-done="phrase">Done</button>
          </div>
        </section>

        <section id="decode-panel" aria-label="Decode" hidden>
          <label for="seed-input">Seed</label>
          <div class="input-row">
            <input id="seed-input" class="entry" type="text" placeholder="Paste or type a seed"
              autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
            <button id="roll" type="button" hidden>Roll</button>
            <button class="done" type="button" data-done="seed-input">Done</button>
          </div>
        </section>

        <section id="keypad-panel" aria-label="Phone keypad" hidden>
          <div class="keypad-entry">
            <label for="phone-text">Phrase</label>
            <input id="phone-text" class="entry" type="text" placeholder="Tap a key" readonly>
            <button id="use-phrase" type="button">Use phrase</button>
            <p class="hint">Tap again to cycle. Use Next to start another letter on the same key.</p>
          </div>
          <div id="phone-keys" class="phone-keys" aria-label="Keypad"></div>
        </section>

        <section id="seeds-panel" aria-label="Seed library" hidden>
          <div class="collection" aria-label="Seed collections" role="group">
            <button type="button" data-collection="examples" aria-pressed="true">Examples</button>
            <button type="button" data-collection="saved" aria-pressed="false">Saved</button>
          </div>
          <div class="pager" id="library-pager">
            <button id="previous" type="button" aria-label="Previous seed">&larr;</button>
            <output id="library-count" aria-live="polite"></output>
            <button id="next" type="button" aria-label="Next seed">&rarr;</button>
          </div>
        </section>
      </div>

      <section id="result" class="result" aria-label="Result">
        <div id="method-row">
          <label for="method">Method</label>
          <div class="select">
            <select id="method"></select>
          </div>
        </div>

        <div id="map-settings" class="map-settings" hidden>
          <div class="select">
            <label class="sr-only" for="terrain">Terrain</label>
            <select id="terrain"></select>
          </div>
          <div class="select">
            <label class="sr-only" for="map-size">Map size</label>
            <select id="map-size"></select>
          </div>
        </div>

        <div id="value-row">
          <label id="result-label" for="result-value">Seed</label>
          <input id="result-value" class="entry output-value" type="text" placeholder="—" readonly>
        </div>

        <div class="result-note">
          <p id="result-status" class="hint" role="status"></p>
          <a id="source" href="#" target="_blank" rel="noopener" hidden>Source</a>
        </div>

        <div class="actions" aria-label="Result actions" role="group">
          <button id="copy" type="button">Copy</button>
          <button id="save" type="button">Save</button>
          <button id="share" type="button">Share</button>
          <a id="map" class="button" href="#" target="_blank" rel="noopener" hidden>Map</a>
        </div>
        <p id="notice" class="notice" role="status"></p>
      </section>
    </main>

    <nav class="tabs" aria-label="Tools">
      <button type="button" data-tab="encode" aria-current="page">Encode</button>
      <button type="button" data-tab="decode">Decode</button>
      <button type="button" data-tab="keypad">Keypad</button>
      <button type="button" data-tab="seeds">Seeds</button>
    </nav>

    <noscript>Enable JavaScript to use the seed tools.</noscript>
  </div>
  <dialog id="share-dialog" aria-labelledby="share-label">
    <label id="share-label" for="share-url">Seed link</label>
    <input id="share-url" class="entry" type="text" readonly>
    <form method="dialog"><button>Close</button></form>
  </dialog>
</body>
</html>
